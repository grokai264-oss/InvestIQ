name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'flutter_app/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Create full Flutter project structure
        working-directory: flutter_app
        run: |
          flutter create . --project-name intelligent_stock_engine --org com.investiq --platforms android

      - name: Fix Kotlin + Gradle versions
        working-directory: flutter_app
        run: |
          # Force compatible Kotlin version (fixes 1.7.1 vs 1.9.x mismatch)
          if [ -f android/settings.gradle ]; then
            sed -i 's/id "org.jetbrains.kotlin.android" version ".*"/id "org.jetbrains.kotlin.android" version "1.9.24"/' android/settings.gradle || true
            sed -i "s/id 'org.jetbrains.kotlin.android' version '.*'/id 'org.jetbrains.kotlin.android' version '1.9.24'/" android/settings.gradle || true
          fi

          if [ -f android/build.gradle ]; then
            sed -i "s/ext.kotlin_version = '.*'/ext.kotlin_version = '1.9.24'/" android/build.gradle || true
            sed -i 's/ext.kotlin_version = ".*"/ext.kotlin_version = "1.9.24"/' android/build.gradle || true
          fi

          # Bump Android Gradle Plugin if present in settings.gradle
          if [ -f android/settings.gradle ]; then
            sed -i 's/id "com.android.application" version ".*"/id "com.android.application" version "8.3.2"/' android/settings.gradle || true
            sed -i "s/id 'com.android.application' version '.*'/id 'com.android.application' version '8.3.2'/" android/settings.gradle || true
          fi

          echo "===== android/settings.gradle ====="
          cat android/settings.gradle || true
          echo "===== android/build.gradle ====="
          cat android/build.gradle || true

      - name: Install dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Analyze (non-blocking)
        working-directory: flutter_app
        run: flutter analyze || true

      - name: Build APK (release)
        working-directory: flutter_app
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: InvestIQ-APK
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
