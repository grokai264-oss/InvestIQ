name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'flutter_app/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Create full Flutter project structure
        working-directory: flutter_app
        run: |
          flutter create . --project-name intelligent_stock_engine --org com.investiq --platforms android

      - name: Ensure Android INTERNET permission
        working-directory: flutter_app
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            # Ensure INTERNET permission exists (required for HTTPS to Render)
            if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
              sed -i 's|<manifest |<manifest |' "$MANIFEST"
              sed -i '/<manifest /a\    <uses-permission android:name="android.permission.INTERNET"/>' "$MANIFEST"
            fi
            if ! grep -q 'android.permission.ACCESS_NETWORK_STATE' "$MANIFEST"; then
              sed -i '/android.permission.INTERNET/a\    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>' "$MANIFEST"
            fi
            echo "===== AndroidManifest.xml ====="
            cat "$MANIFEST"
          else
            echo "ERROR: AndroidManifest.xml not found"
            exit 1
          fi

      - name: Fix Gradle + Kotlin + AGP versions
        working-directory: flutter_app
        run: |
          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.7-all.zip|' android/gradle/wrapper/gradle-wrapper.properties
          fi

          if [ -f android/settings.gradle ]; then
            sed -i 's/id "org.jetbrains.kotlin.android" version ".*"/id "org.jetbrains.kotlin.android" version "1.9.24"/' android/settings.gradle || true
            sed -i "s/id 'org.jetbrains.kotlin.android' version '.*'/id 'org.jetbrains.kotlin.android' version '1.9.24'/" android/settings.gradle || true
            sed -i 's/id "com.android.application" version ".*"/id "com.android.application" version "8.5.1"/' android/settings.gradle || true
            sed -i "s/id 'com.android.application' version '.*'/id 'com.android.application' version '8.5.1'/" android/settings.gradle || true
          fi

          if [ -f android/build.gradle ]; then
            sed -i "s/ext.kotlin_version = '.*'/ext.kotlin_version = '1.9.24'/" android/build.gradle || true
            sed -i 's/ext.kotlin_version = ".*"/ext.kotlin_version = "1.9.24"/' android/build.gradle || true
          fi

      - name: Install dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Analyze (non-blocking)
        working-directory: flutter_app
        run: flutter analyze || true

      - name: Build APK (release)
        working-directory: flutter_app
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: InvestIQ-APK
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
