name: Keep Render Awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          URL="https://investiq-g92v.onrender.com"
          echo "Pinging $URL/health"
          # /health returns 200 when the app is up; root used to 404 and break curl -f
          curl -fsS --max-time 90 "$URL/health" || echo "Ping failed (cold start is ok)"
          echo "Done"
