name: Keep Render Awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          URL="https://investiq-g92v.onrender.com"
          echo "Pinging $URL/"
          curl -fsS --max-time 60 "$URL/" || echo "Ping failed (cold start is ok)"
          echo "Done"
